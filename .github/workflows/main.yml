from pathlib import Path

html = r'''<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Music Maker</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#15152b,#30205c);color:#fff;min-height:100vh}
.container{max-width:700px;margin:auto;padding:22px}
h1{text-align:center;margin:8px 0 4px;font-size:32px}
.subtitle{text-align:center;color:#cfc8e8;margin-bottom:22px}
.card{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:18px;margin-bottom:16px}
label{display:block;font-weight:bold;margin:12px 0 7px}
input,textarea,select{width:100%;border:0;border-radius:12px;padding:13px;font-size:16px;background:#fff;color:#222}
textarea{min-height:120px;resize:vertical}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.option{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);padding:11px;border-radius:12px}
.option input{width:auto}
button{border:0;border-radius:14px;padding:14px 18px;font-size:16px;font-weight:bold;cursor:pointer}
.primary{width:100%;background:#ff4fa3;color:white;font-size:18px;margin-top:16px}
.secondary{background:#fff;color:#222;margin-right:8px}
.danger{background:#e74c3c;color:#fff}
.status{text-align:center;margin-top:12px;color:#ddd;min-height:22px}
audio{width:100%;margin-top:12px}
.small{font-size:13px;color:#c9c2dd}
#customGenre{display:none;margin-top:10px}
</style>
</head>
<body>
<div class="container">
<h1>🎵 AI Music Maker</h1>
<div class="subtitle">Crea la tua canzone in pochi passaggi</div>

<div class="card">
<label for="idea">Idea della canzone</label>
<input id="idea" placeholder="Es. Una notte d'estate al mare">

<label for="lyrics">Testo della canzone</label>
<textarea id="lyrics" placeholder="Scrivi qui il testo..."></textarea>

<label for="genre">Genere / stile musicale</label>
<select id="genre" onchange="toggleCustom()">
<option>Pop</option><option>Dance</option><option>Rap</option>
<option>Rock</option><option>Reggaeton</option><option>Ballad</option>
<option>Hip-Hop</option><option>Jazz</option><option>Blues</option>
<option>Classica</option><option>R&B</option><option>Soul</option>
<option>Country</option><option>Disco/Funk</option><option>Reggae</option>
<option>Trap</option><option>Musica italiana</option>
<option>Stile personalizzato</option>
</select>
<input id="customGenre" placeholder="Descrivi lo stile che vuoi">

<label>Voce</label>
<div class="grid">
<label class="option"><input type="radio" name="voice" value="male" checked> Voce maschile</label>
<label class="option"><input type="radio" name="voice" value="female"> Voce femminile</label>
<label class="option"><input type="radio" name="voice" value="instrumental"> Solo strumentale</label>
<label class="option"><input type="radio" name="voice" value="myvoice"> La mia voce</label>
</div>

<div id="recordBox" style="display:none;margin-top:12px">
<button class="secondary" onclick="startRecording()">🎙️ Registra</button>
<button class="danger" onclick="stopRecording()">⏹ Stop</button>
<button class="secondary" onclick="playRecording()">▶ Riproduci</button>
<div class="small" id="recordStatus">Nessuna registrazione</div>
<audio id="voiceAudio" controls style="display:none"></audio>
</div>

<label for="duration">Durata</label>
<select id="duration">
<option value="30">30 secondi</option>
<option value="60">1 minuto</option>
<option value="120">2 minuti</option>
<option value="180">3 minuti</option>
</select>

<button class="primary" onclick="generateSong()">✨ Genera canzone</button>
<div class="status" id="status"></div>
<div id="result" style="display:none">
<audio id="resultAudio" controls></audio>
</div>
</div>

<div class="card">
<div class="small">
Questa versione HTML contiene l'interfaccia, la scelta dello stile, la registrazione della tua voce e la gestione della richiesta. La generazione audio reale richiede un servizio AI/backend collegato.
</div>
</div>
</div>

<script>
let recorder=null, chunks=[], voiceBlob=null, voiceUrl=null;

function toggleCustom(){
  const custom=document.getElementById('customGenre');
  custom.style.display=document.getElementById('genre').value==='Stile personalizzato'?'block':'none';
  const v=document.querySelector('input[name="voice"]:checked').value;
  document.getElementById('recordBox').style.display=v==='myvoice'?'block':'none';
}
document.querySelectorAll('input[name="voice"]').forEach(x=>x.addEventListener('change',toggleCustom));

async function startRecording(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    chunks=[];
    recorder=new MediaRecorder(stream);
    recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
    recorder.onstop=()=>{
      voiceBlob=new Blob(chunks,{type:'audio/webm'});
      if(voiceUrl) URL.revokeObjectURL(voiceUrl);
      voiceUrl=URL.createObjectURL(voiceBlob);
      const a=document.getElementById('voiceAudio');
      a.src=voiceUrl;a.style.display='block';
      document.getElementById('recordStatus').textContent='Registrazione pronta';
      stream.getTracks().forEach(t=>t.stop());
    };
    recorder.start();
    document.getElementById('recordStatus').textContent='Registrazione in corso...';
  }catch(e){
    document.getElementById('recordStatus').textContent='Microfono non disponibile: controlla i permessi.';
  }
}
function stopRecording(){
  if(recorder && recorder.state!=='inactive') recorder.stop();
}
function playRecording(){
  const a=document.getElementById('voiceAudio');
  if(a.src) a.play();
}
function generateSong(){
  const idea=document.getElementById('idea').value.trim();
  const lyrics=document.getElementById('lyrics').value.trim();
  const genre=document.getElementById('genre').value==='Stile personalizzato'
    ?document.getElementById('customGenre').value.trim()
    :document.getElementById('genre').value;
  const duration=document.getElementById('duration').value;
  const voice=document.querySelector('input[name="voice"]:checked').value;
  const status=document.getElementById('status');

  if(!idea && !lyrics){status.textContent='Inserisci almeno l’idea o il testo della canzone.';return;}
  status.textContent='Richiesta preparata: '+genre+' · '+duration+' secondi · '+voice+'.';
  document.getElementById('result').style.display='block';
  status.textContent+=' Per l’audio reale serve collegare un motore AI musicale.';
}
</script>
</body>
</html>'''
path = Path("/mnt/data/AI_Music_Maker.html")
path.write_text(html, encoding="utf-8")
print(f"[Scarica il codice HTML di AI Music Maker](sandbox:{path})")
